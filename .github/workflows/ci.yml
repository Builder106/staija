name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  check:
    name: Type-check & Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Audit Functions dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high
      - name: Reject retired Vectorizer backend
        run: npm run avatars:check-backend
      # Scope the CI audit to production dependencies, which matches the
      # application's deployed attack surface. Build and operator tools are
      # not shipped in the browser bundle.
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Open-source license compliance scan
        run: npx license-checker --summary --production
      - name: TypeScript validation
        run: npx vue-tsc -b
      - name: Typecheck tools
        run: npm run typecheck:tools
      - name: Typecheck Cloud Functions
        run: npm --prefix functions run build

  test:
    name: Unit tests & coverage gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage

  build:
    name: Build & Bundle Budget
    needs: [lint, format, check, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify bundle size budget
        run: |
          echo "=== Output bundle files ==="
          ls -lh dist/
          TOTAL_KB=$(du -sk dist | cut -f1)
          echo "Total bundle size: ${TOTAL_KB} KB"
          if [ "$TOTAL_KB" -gt 50000 ]; then
            echo "Bundle size exceeded 50MB budget ceiling: ${TOTAL_KB} KB"
            exit 1
          fi
      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E & Accessibility
    needs: [lint, format, check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run public-site QA E2E
        run: npm run test:e2e
      - name: Run automated accessibility audit
        run: npm run test:accessibility
      - name: Upload Playwright artifacts on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            audit-output/
          retention-days: 7
          if-no-files-found: ignore

  matrix-evidence:
    name: Accessibility matrix evidence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run verify:a11y-matrix -- --mode=pr

  deploy:
    name: Trigger Vercel Deploy
    needs: [secrets, build, e2e, matrix-evidence]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging history
        if: github.ref == 'refs/heads/staging'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check staging deployment changes
        id: staging_changes
        if: github.ref == 'refs/heads/staging'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git diff --quiet "$BEFORE" "$AFTER" -- . ':!JOURNAL.md' ':!ROADMAP.md'; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "JOURNAL.md and ROADMAP.md are the only changes; skipping the staging deployment."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging' && steps.staging_changes.outputs.deploy == 'true'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_PROD is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"
