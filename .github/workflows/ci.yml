name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm run format

  check:
    name: Type-check & Compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      # --omit=dev: firebase-tools (devDependency, CLI only, never shipped)
      # bundles a deep tree with several CVEs that would require a breaking
      # firebase-tools major bump to clear. Scoped to production deps, which
      # matches the app's actual deployed attack surface.
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Open-source license compliance scan
        run: npx license-checker --summary --production
      - name: TypeScript validation
        run: npx vue-tsc -b

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build:
    name: Build & Bundle Budget
    needs: [lint, format, check, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Verify bundle size budget
        run: |
          echo "=== Output bundle files ==="
          ls -lh dist/
          TOTAL_KB=$(du -sk dist | cut -f1)
          echo "Total bundle size: ${TOTAL_KB} KB"
          if [ "$TOTAL_KB" -gt 50000 ]; then
            echo "Bundle size exceeded 50MB budget ceiling: ${TOTAL_KB} KB"
            exit 1
          fi
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E & Accessibility
    needs: [lint, format, check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: 'npm'
      - run: npm ci
      - name: Install ffmpeg for demo video processing
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Demo E2E & a11y suite
        run: npm run demo
      - name: Upload Playwright artifacts on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-results
          path: |
            test-results/
            e2e/videos/
          retention-days: 7
          if-no-files-found: ignore
