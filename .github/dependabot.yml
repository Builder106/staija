version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tiptap:
        patterns:
          - "@tiptap/*"
      eslint:
        patterns:
          - "eslint*"
          - "@typescript-eslint/*"
          - "typescript-eslint*"
      vitest:
        patterns:
          - "vitest*"
          - "@vitest/*"
      playwright:
        patterns:
          - "playwright*"
          - "@playwright/*"
      vercel:
        patterns:
          - "@vercel/*"
      contentful:
        patterns:
          - "@contentful/*"
          - "contentful*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        versions:
          - ">= 7.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
