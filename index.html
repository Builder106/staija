    <meta name="theme-color" content="#F1F5F9" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('staija.theme');
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved =
            choice === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : choice;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = resolved === 'dark' ? '#0B0E12' : '#F1F5F9';
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="app">
      <!-- Static skeleton: Remove flex:1 from main to prevent flexbox two-pass layout.
           Wrapper: min-height: 100vh, flex column.
           Header: flex-shrink-0, 85px.
           Main: fixed height 3017px (matches Vue final render), NO flex:1.
           Footer: flex-shrink-0, 559px.
           This prevents the initial flex:1 sizing (viewport-constrained) then
           min-height expansion that causes the layout shift. -->
      <div
        style="
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          background: #f1f5f9;
          color: #0b0e12;
        "
      >
        <!-- Header: flex-shrink-0, fixed 85px -->
        <header
          style="
            flex: 0 0 85px;
            padding: 20px 1.5rem;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
          "
          aria-hidden="true"
        >
          <div
            style="
              max-width: 80rem;
              margin: 0 auto;
              display: flex;
              align-items: center;
              justify-content: space-between;
              height: 100%;
            "
          >
            <div
              style="width: 40px; height: 40px; background: #e2e8f0; border-radius: 0.375rem"
            ></div>
            <nav style="display: none" aria-hidden="true"></nav>
            <div style="min-width: 260px"></div>
          </div>
        </header>
        <!-- Main: FIXED height 3017px (matches Lighthouse Vue render). NO flex:1.
             This prevents the flex container from initially sizing main to
             viewport-remaining (256px) then expanding to min-height (3017px). -->
        <main style="height: 3017px; display: flex; flex-direction: column">
          <!-- Section placeholders: fixed heights matching Lighthouse-measured Vue render.
               Sum = 951+1+245+1+516+1+707+1+598 = 3021px (4px rounding vs 3017px). -->
          <div style="height: 951px"></div>
          <div style="height: 1px; background: rgba(14, 18, 23, 0.08)"></div>
          <div style="height: 245px"></div>
          <div style="height: 1px; background: rgba(14, 18, 23, 0.08)"></div>
          <div style="height: 516px"></div>
          <div style="height: 1px; background: rgba(14, 18, 23, 0.08)"></div>
          <div style="height: 707px"></div>
          <div style="height: 1px; background: rgba(14, 18, 23, 0.08)"></div>
          <div style="height: 598px"></div>
        </main>
        <!-- Footer: flex-shrink-0, fixed 559px (matches Lighthouse) -->
        <footer
          style="
            flex: 0 0 559px;
            background: #0b0e12;
            color: #f1f5f9;
            font-family: 'IBM Plex Sans Fallback', Arial, sans-serif;
          "
          aria-hidden="true"
        >
          <div
            style="
              position: absolute;
              top: 0;
              left: 0;
              right: 0;
              height: 2px;
              background: linear-gradient(90deg, #7c3aed, #06b6d4);
            "
          ></div>
          <div style="height: 100%"></div>
        </footer>
      </div>
    </div>
